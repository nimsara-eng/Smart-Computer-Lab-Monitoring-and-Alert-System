# Smart Computer Lab Monitoring and Alert System - server settings

# TCP: registration, messages, alerts, process lists.  UDP: heartbeats.
tcp.port=5000
udp.port=5001

# Each lab PC sends a heartbeat every heartbeat.interval.sec seconds.
# A PC that is silent for heartbeat.timeout.sec seconds is reported as NOT RESPONDING.
heartbeat.interval.sec=2
heartbeat.timeout.sec=8

# How often each lab PC reports its running processes.
process.report.sec=10

# Alert limits (percent). CPU must stay above the limit for cpu.consecutive heartbeats.
cpu.threshold=85
cpu.consecutive=3
memory.threshold=90
disk.threshold=90

# Alerts clear only after 3 consecutive low readings. This prevents
# repeated WARNING/INFO messages when usage oscillates near a limit.
# Recovery limits must be lower than their corresponding alert limits.
cpu.recovery.threshold=80
memory.recovery.threshold=85
disk.recovery.threshold=85
alert.recovery.consecutive=3

# Applications that are not allowed in the lab (comma separated, not case sensitive).
blocked.apps=steam.exe,epicgameslauncher.exe,valorant.exe,vlc.exe,utorrent.exe,bittorrent.exe

log.file=logs/alerts.csv
